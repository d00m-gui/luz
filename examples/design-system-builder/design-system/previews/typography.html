<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@latest/400.css" />

  <h1>Aa — DM Serif Display / heading</h1>
  <h3>font-weight: var(--font-bold-weight) (800)</h3>
